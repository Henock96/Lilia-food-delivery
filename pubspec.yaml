name: lilia_food_delivery
description: "Application livreur Lilia Food — Brazzaville, Congo."
publish_to: 'none'

version: 1.0.3+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  google_fonts: ^8.2.1

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_messaging: ^16.6.0
  firebase_analytics: ^12.5.0
  cached_network_image: ^4.0.0
  flutter_cache_manager: ^3.4.2

  # State management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Navigation
  go_router: ^18.0.1

  # HTTP
  dio: ^5.11.0

  # Local storage
  shared_preferences: ^2.5.5

  # Notifications
  flutter_local_notifications: ^22.3.0

  # UI
  iconsax: ^0.0.8

  # Maps & Location
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  permission_handler: ^13.0.1

  # WebSocket tracking
  socket_io_client: ^3.1.6

  # Connectivity
  connectivity_plus: ^7.3.1

  # Utils
  intl: ^0.20.3
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  http_mock_adapter: ^0.6.1
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo1.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFF8F6"